version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecom_warehouse
    ports:
      - "5432:5432"
    volumes:
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  metabase:
    image: metabase/metabase:latest
    container_name: ecom-metabase
    ports:
      - "3000:3000"
    depends_on:
      - postgres
